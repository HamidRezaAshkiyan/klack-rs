[package]
name = "klack-rs"
version = "0.1.0"
description = "Cross-platform mechanical keyboard, mouse, and scroll sound engine compatible 1:1 with Klack"
authors = ["HamidReza Ashkiyan"]
license = "MIT"
edition = "2021"

[lib]
name = "klack_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Audio & DSP
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "pcm", "wav"] }
crossbeam-channel = "0.5"
fastrand = "2"

# State, serialization & logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform-specific native input & OS integration
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"

[dev-dependencies]
tempfile = "3"
